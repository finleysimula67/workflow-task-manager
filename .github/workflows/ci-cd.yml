name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ==========================================
  # 1. BACKEND CI (Spring Boot)
  # ==========================================
  backend-ci:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./workflow-task-manager-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Skip DB Tests)
        run: mvn clean package -DskipTests


  # ==========================================
  # 2. FRONTEND CI (React/Node.js)
  # ==========================================
  frontend-ci:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./workflow-task-manager-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './workflow-task-manager-frontend/package-lock.json'

      - name: Install Dependencies & Build Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build --if-present


  # ==========================================
  # 3. DEPLOY BACKEND TO RENDER
  # ==========================================
  deploy-backend:
    name: Deploy Backend to Render

    needs:
      - backend-ci
      - frontend-ci

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Backend → Render
      # ----------------------------------------
      - name: Trigger Backend Deploy
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_BACKEND_DEPLOY_HOOK is not configured."
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            "$RENDER_BACKEND_DEPLOY_HOOK"
