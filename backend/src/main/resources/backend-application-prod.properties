## ============================================
## PRODUCTION SETTINGS - Render Deployment
## ============================================

## Database - uses Render's Internal Database URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

## JWT Secret (set in Render env vars)
jwt.secret=${JWT_SECRET}

## CORS - allow your Render frontend URL
cors.allowed.origins=${FRONTEND_URL}

## App URLs
app.oauth2.redirect-uri=${FRONTEND_URL}/auth/callback
app.frontend.url=${FRONTEND_URL}
app.email.from=${MAIL_USERNAME}

## Mail (use your Gmail credentials as Render env vars)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

## OAuth2 Google (set in Render env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

## Logging
logging.level.root=INFO
logging.level.com.nabin.workflow=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
