spring:
  application:
    name: WorkFlow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 52428800
    max-swallow-size: 52428800
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  oauth2:
    redirect-uri: http://localhost:5173/auth/callback
  email:
    from: ${MAIL_USERNAME}
    from-name: WorkFlow Team
  frontend:
    url: http://localhost:5173
  verification:
    token-expiration: 86400000
  password-reset:
    token-expiration: 3600000

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000
  remember-me-expiration: 2592000000
  issuer: WorkFlow

cors:
  allow-local-origins: ${CORS_ALLOW_LOCAL_ORIGINS:true}
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:4200}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    com.nabin.workflow: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/workflow.log
    max-size: 10MB
    max-history: 30