services:
  - type: web
    name: workflow-task-manager-backend
    runtime: docker
    plan: free

    rootDir: workflow-task-manager-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /actuator/health

    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOW_LOCAL_ORIGINS
        value: "false"
      - key: UPLOAD_DIR
        value: uploads

      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
